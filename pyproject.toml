[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livekit-plugins-volcengine"
version = "1.3.0"
description = "LiveKit Agent Plugins for Volcengine"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "wangmengdi", email = "790990241@qq.com"}
]
keywords = ["audio", "livekit", "realtime", "video", "webrtc"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "livekit-agents==1.2.9",
    "numpy",
    "openai>=1.75.0",
    "osc-data==0.2.2",
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/your-username/livekit-plugins-volcengine"
Repository = "https://github.com/your-username/livekit-plugins-volcengine"
Issues = "https://github.com/your-username/livekit-plugins-volcengine/issues"

[tool.setuptools.packages.find]
include = ["livekit*"]

[tool.setuptools.package-data]
"livekit.plugins.volcengine" = ["py.typed"]
